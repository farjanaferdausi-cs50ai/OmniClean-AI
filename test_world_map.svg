<svg xmlns="http://www.w3.org/2000/svg" width="209" height="119" viewBox="0 0 209 119">
  <defs>
    <!-- Dark blue-grey gradient from #3a536d to #5a7893 -->
    <linearGradient id="americas-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a536d"/>
      <stop offset="100%" stop-color="#5a7893"/>
    </linearGradient>
  </defs>

  <!-- Background ocean / map container -->
  <rect width="209" height="119" fill="#eef2f6"/>

  <!-- Faint graticule lines -->
  <g stroke="#dfe6ee" stroke-width="0.55">
